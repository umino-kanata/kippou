<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉方位を調べる</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 18px;
      background: #f3f3f3;
      border-radius: 10px;
      display: none;
      line-height: 1.8;
    }

    .honmei {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>吉方位を調べる</h1>

    <p>
      生年月日と調べたい日を入力してください
    </p>

    <label for="birthday">生年月日</label>
    <input type="date" id="birthday">

    <label for="targetDate">吉方位を調べたい日</label>
    <input type="date" id="targetDate">

    <button onclick="checkDirection()">
      吉方位を調べる
    </button>

    <div id="result"></div>

  </div>

  <script>

    const starNames = {
      1: "一白水星",
      2: "二黒土星",
      3: "三碧木星",
      4: "四緑木星",
      5: "五黄土星",
      6: "六白金星",
      7: "七赤金星",
      8: "八白土星",
      9: "九紫火星"
    };

    function getHonmeiStar(dateString) {

      const parts = dateString.split("-");
      const year = Number(parts[0]);
      const month = Number(parts[1]);
      const day = Number(parts[2]);

      /*
        立春前後については、次の段階で
        萬年暦と照合した正確な節入り判定を追加します。
      */

      if (
        month === 1 ||
        (month === 2 && day <= 5)
      ) {
        return {
          status: "pending",
          message: "立春前後の生年月日は、次の段階で正確な節入り判定を追加します。"
        };
      }

      /*
        2026年＝一白水星を基準に、
        本命星は9年周期で循環します。
      */

      const offset = ((2026 - year) % 9 + 9) % 9;
      const starNumber = offset + 1;

      return {
        status: "ok",
        number: starNumber,
        name: starNames[starNumber]
      };
    }


    function checkDirection() {

      const birthday =
        document.getElementById("birthday").value;

      const targetDate =
        document.getElementById("targetDate").value;

      const result =
        document.getElementById("result");

      if (!birthday || !targetDate) {

        result.style.display = "block";

        result.innerHTML =
          "生年月日と調べたい日を両方入力してください。";

        return;
      }

      const honmei = getHonmeiStar(birthday);

      result.style.display = "block";

      if (honmei.status === "pending") {

        result.innerHTML = `
          <strong>生年月日：</strong>${birthday}<br>
          <strong>調べたい日：</strong>${targetDate}<br><br>
          ${honmei.message}
        `;

        return;
      }

      result.innerHTML = `
        <strong>生年月日：</strong>${birthday}<br>

        <strong>本命星：</strong>
        <div class="honmei">${honmei.name}</div>

        <strong>調べたい日：</strong>${targetDate}<br><br>

        吉方位の計算機能は、
        これから追加します。
      `;
    }

  </script>

</body>
</html>
