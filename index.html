<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉方位を調べる</title>

<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  margin: 0;
  padding: 30px 15px;
}
.container {
  max-width: 500px;
  margin: 0 auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
h1 { text-align:center; font-size:28px; }
p { text-align:center; color:#555; }
label {
  display:block;
  margin-top:20px;
  margin-bottom:6px;
  font-weight:bold;
}
input {
  width:100%;
  box-sizing:border-box;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
}
button {
  width:100%;
  margin-top:25px;
  padding:14px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
#result {
  margin-top:25px;
  padding:18px;
  background:#f3f3f3;
  border-radius:10px;
  display:none;
  line-height:1.8;
}
.honmei {
  font-size:24px;
  font-weight:bold;
  margin:8px 0 16px;
}
.data-box {
  margin-top:18px;
  padding:15px;
  background:white;
  border-radius:10px;
}
.data-title {
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>吉方位を調べる</h1>
<p>生年月日と調べたい日を入力してください</p>

<label for="birthday">生年月日</label>
<input type="date" id="birthday">

<label for="targetDate">吉方位を調べたい日</label>
<input type="date" id="targetDate">

<button onclick="checkDirection()">吉方位を調べる</button>

<div id="result"></div>

</div>

<script>

const starNames = {
  1:"一白水星",
  2:"二黒土星",
  3:"三碧木星",
  4:"四緑木星",
  5:"五黄土星",
  6:"六白金星",
  7:"七赤金星",
  8:"八白土星",
  9:"九紫火星"
};

const stems =
["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];

const branches =
["子","丑","寅","卯","辰","巳",
 "午","未","申","酉","戌","亥"];


/* ---------- ユリウス日 ---------- */

function toJulianDay(date) {

  let y = date.getUTCFullYear();
  let m = date.getUTCMonth()+1;

  const d =
    date.getUTCDate()
    + date.getUTCHours()/24
    + date.getUTCMinutes()/1440
    + date.getUTCSeconds()/86400;

  if(m<=2){
    y--;
    m+=12;
  }

  const A=Math.floor(y/100);
  const B=2-A+Math.floor(A/4);

  return Math.floor(365.25*(y+4716))
    +Math.floor(30.6001*(m+1))
    +d+B-1524.5;
}


/* ---------- 太陽黄経 ---------- */

function solarLongitude(date){

  const JD=toJulianDay(date);
  const T=(JD-2451545.0)/36525;

  let L0=
    280.46646+
    T*(36000.76983+T*0.0003032);

  L0=((L0%360)+360)%360;

  const M=
    357.52911+
    T*(35999.05029-0.0001537*T);

  const rad=Math.PI/180;

  const C=
    (1.914602-T*(0.004817+0.000014*T))
      *Math.sin(M*rad)
    +(0.019993-0.000101*T)
      *Math.sin(2*M*rad)
    +0.000289*Math.sin(3*M*rad);

  const trueLongitude=L0+C;

  const omega=125.04-1934.136*T;

  let longitude=
    trueLongitude
    -0.00569
    -0.00478*Math.sin(omega*rad);

  return ((longitude%360)+360)%360;
}


function angleDifference(angle,target){
  return ((angle-target+540)%360)-180;
}


/* ---------- 指定黄経になる日時 ---------- */

function getSolarTerm(year, month, targetAngle){

  let start=
    new Date(Date.UTC(year,month-1,1));

  let end=
    new Date(Date.UTC(year,month-1,12));

  for(let i=0;i<50;i++){

    const middle=
      new Date(
        (start.getTime()+end.getTime())/2
      );

    const diff=
      angleDifference(
        solarLongitude(middle),
        targetAngle
      );

    if(diff<0){
      start=middle;
    }else{
      end=middle;
    }
  }

  return end;
}


/* ---------- 日本時間の日付 ---------- */

function getSolarTermDateJST(year,month,angle){

  const term=getSolarTerm(year,month,angle);

  const jst=
    new Date(
      term.getTime()+9*60*60*1000
    );

  return {
    year:jst.getUTCFullYear(),
    month:jst.getUTCMonth()+1,
    day:jst.getUTCDate()
  };
}


/* ---------- 立春 ---------- */

function getRisshunDateJST(year){
  return getSolarTermDateJST(year,2,315);
}


/* ---------- 年の切替 ---------- */

function getEffectiveYear(dateString){

  const p=dateString.split("-");

  let year=Number(p[0]);
  const month=Number(p[1]);
  const day=Number(p[2]);

  const risshun=getRisshunDateJST(year);

  if(
    month<risshun.month ||
    (month===risshun.month && day<risshun.day)
  ){
    year--;
  }

  return {
    year:year,
    risshun:risshun
  };
}


/* ---------- 年盤九星 ---------- */

function getYearStar(year){

  const offset=
    ((2026-year)%9+9)%9;

  const number=offset+1;

  return {
    number:number,
    name:starNames[number]
  };
}


/* ---------- 年干支 ---------- */

function getYearKanshi(year){

  const s=((year-1984)%10+10)%10;
  const b=((year-1984)%12+12)%12;

  return {
    stem:stems[s],
    branch:branches[b],
    name:stems[s]+branches[b]
  };
}


/* ---------- 本命星 ---------- */

function getHonmeiStar(dateString){

  const e=getEffectiveYear(dateString);
  return getYearStar(e.year);
}


/* ---------- 年盤 ---------- */

function getTargetYearData(dateString){

  const e=getEffectiveYear(dateString);

  return {
    year:e.year,
    star:getYearStar(e.year),
    kanshi:getYearKanshi(e.year)
  };
}


/* --------------------------------
   月の節入り

   2月 315° 立春
   3月 345° 啓蟄
   4月  15° 清明
   5月  45° 立夏
   6月  75° 芒種
   7月 105° 小暑
   8月 135° 立秋
   9月 165° 白露
  10月 195° 寒露
  11月 225° 立冬
  12月 255° 大雪
   1月 285° 小寒
-------------------------------- */

const monthAngles = {
  1:285,
  2:315,
  3:345,
  4:15,
  5:45,
  6:75,
  7:105,
  8:135,
  9:165,
  10:195,
  11:225,
  12:255
};


/* ---------- 節月を判定 ---------- */

function getSetsuMonth(dateString){

  const p=dateString.split("-");

  const year=Number(p[0]);
  const month=Number(p[1]);
  const day=Number(p[2]);

  const term=
    getSolarTermDateJST(
      year,
      month,
      monthAngles[month]
    );

  let setsuMonth;

  if(day>=term.day){
    setsuMonth=month;
  }else{
    setsuMonth=month-1;
    if(setsuMonth===0){
      setsuMonth=12;
    }
  }

  return {
    setsuMonth:setsuMonth,
    term:term
  };
}


/* ---------- 月盤九星 ---------- */

function getMonthKanshi(dateString){

  const setsu=getSetsuMonth(dateString);

  const effectiveYear=setsu.setsuYear;

  const yearStem=
    getYearKanshi(effectiveYear).stem;

  const yearStemIndex=
    stems.indexOf(yearStem);

  /*
    寅月の月干

    甲・己年 → 丙
    乙・庚年 → 戊
    丙・辛年 → 庚
    丁・壬年 → 壬
    戊・癸年 → 甲
  */

  const febStemStart = {
    0:2,
    5:2,
    1:4,
    6:4,
    2:6,
    7:6,
    3:8,
    8:8,
    4:0,
    9:0
  };

  let distance;

  if(setsu.setsuMonth>=2){
    distance=setsu.setsuMonth-2;
  }else{
    distance=11;
  }

  const stemIndex=
    (febStemStart[yearStemIndex]+distance)%10;

  const branchIndex=
    (2+distance)%12;

  return {
    stem:stems[stemIndex],
    branch:branches[branchIndex],
    name:
      stems[stemIndex]+
      branches[branchIndex]
  };
}

/* ---------- 月干支 ---------- */

function getMonthKanshi(dateString){

  const p=dateString.split("-");
  const calendarYear=Number(p[0]);

  const setsu=getSetsuMonth(dateString);

  let effectiveYear=calendarYear;

  if(setsu.setsuMonth===1){
    effectiveYear=calendarYear-1;
  }

  const yearStem=
    getYearKanshi(effectiveYear).stem;

  const yearStemIndex=
    stems.indexOf(yearStem);

  /*
    寅月（2月）の月干

    甲・己年 → 丙
    乙・庚年 → 戊
    丙・辛年 → 庚
    丁・壬年 → 壬
    戊・癸年 → 甲
  */

  const febStemStart = {
    0:2,
    5:2,
    1:4,
    6:4,
    2:6,
    7:6,
    3:8,
    8:8,
    4:0,
    9:0
  };

  let distance;

  if(setsu.setsuMonth>=2){
    distance=setsu.setsuMonth-2;
  }else{
    distance=11;
  }

  const stemIndex=
    (febStemStart[yearStemIndex]+distance)%10;

  /*
    2月＝寅、3月＝卯……
  */

  const branchIndex=
    (2+distance)%12;

  return {
    stem:stems[stemIndex],
    branch:branches[branchIndex],
    name:
      stems[stemIndex]+
      branches[branchIndex]
  };
}


/* ---------- 月盤データ ---------- */

function getTargetMonthData(dateString){

  const setsu=getSetsuMonth(dateString);

  return {
    setsuMonth:setsu.setsuMonth,
    term:setsu.term,
    star:getMonthStar(dateString),
    kanshi:getMonthKanshi(dateString)
  };
}


/* ---------- 表示 ---------- */

function checkDirection(){

  const birthday=
    document.getElementById("birthday").value;

  const targetDate=
    document.getElementById("targetDate").value;

  const result=
    document.getElementById("result");

  if(!birthday || !targetDate){

    result.style.display="block";
    result.innerHTML=
      "生年月日と調べたい日を両方入力してください。";

    return;
  }

  const honmei=
    getHonmeiStar(birthday);

  const yearData=
    getTargetYearData(targetDate);

  const monthData=
    getTargetMonthData(targetDate);

  result.style.display="block";

  result.innerHTML=`

    <strong>生年月日：</strong>
    ${birthday}<br>

    <strong>本命星：</strong>

    <div class="honmei">
      ${honmei.name}
    </div>


    <div class="data-box">

      <div class="data-title">
        年盤
      </div>

      <strong>九星：</strong>
      ${yearData.star.name}<br>

      <strong>干支：</strong>
      ${yearData.kanshi.name}

    </div>


    <div class="data-box">

      <div class="data-title">
        月盤
      </div>

      <strong>九星：</strong>
      ${monthData.star.name}<br>

      <strong>干支：</strong>
      ${monthData.kanshi.name}<br>

      <strong>節入り：</strong>
      ${monthData.term.month}月
      ${monthData.term.day}日

    </div>

    <br>

    吉方位の計算機能は、
    これから追加します。

  `;
}

</script>

</body>
</html>
