<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉方位を調べる</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 18px;
      background: #f3f3f3;
      border-radius: 10px;
      display: none;
      line-height: 1.8;
    }

    .honmei {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0 16px;
    }

    .year-box {
      margin-top: 18px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }

    .year-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>吉方位を調べる</h1>

  <p>生年月日と調べたい日を入力してください</p>

  <label for="birthday">生年月日</label>
  <input type="date" id="birthday">

  <label for="targetDate">吉方位を調べたい日</label>
  <input type="date" id="targetDate">

  <button onclick="checkDirection()">
    吉方位を調べる
  </button>

  <div id="result"></div>

</div>

<script>

const starNames = {
  1: "一白水星",
  2: "二黒土星",
  3: "三碧木星",
  4: "四緑木星",
  5: "五黄土星",
  6: "六白金星",
  7: "七赤金星",
  8: "八白土星",
  9: "九紫火星"
};

const stems = [
  "甲", "乙", "丙", "丁", "戊",
  "己", "庚", "辛", "壬", "癸"
];

const branches = [
  "子", "丑", "寅", "卯", "辰", "巳",
  "午", "未", "申", "酉", "戌", "亥"
];


/* 日時 → ユリウス日 */

function toJulianDay(date) {

  let y = date.getUTCFullYear();
  let m = date.getUTCMonth() + 1;

  const d =
    date.getUTCDate()
    + date.getUTCHours() / 24
    + date.getUTCMinutes() / 1440
    + date.getUTCSeconds() / 86400;

  if (m <= 2) {
    y--;
    m += 12;
  }

  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);

  return (
    Math.floor(365.25 * (y + 4716))
    + Math.floor(30.6001 * (m + 1))
    + d + B - 1524.5
  );
}


/* 太陽の視黄経 */

function solarLongitude(date) {

  const JD = toJulianDay(date);
  const T = (JD - 2451545.0) / 36525;

  let L0 =
    280.46646
    + T * (36000.76983 + T * 0.0003032);

  L0 = ((L0 % 360) + 360) % 360;

  const M =
    357.52911
    + T * (35999.05029 - 0.0001537 * T);

  const rad = Math.PI / 180;

  const C =
    (1.914602 - T * (0.004817 + 0.000014 * T))
      * Math.sin(M * rad)
    + (0.019993 - 0.000101 * T)
      * Math.sin(2 * M * rad)
    + 0.000289
      * Math.sin(3 * M * rad);

  const trueLongitude = L0 + C;

  const omega =
    125.04 - 1934.136 * T;

  let longitude =
    trueLongitude
    - 0.00569
    - 0.00478 * Math.sin(omega * rad);

  longitude =
    ((longitude % 360) + 360) % 360;

  return longitude;
}


/* 角度差 */

function angleDifference(angle, target) {
  return ((angle - target + 540) % 360) - 180;
}


/* その年の立春を計算 */

function getRisshun(year) {

  let start =
    new Date(Date.UTC(year, 1, 1, 0, 0, 0));

  let end =
    new Date(Date.UTC(year, 1, 7, 0, 0, 0));

  for (let i = 0; i < 50; i++) {

    const middle =
      new Date(
        (start.getTime() + end.getTime()) / 2
      );

    const diff =
      angleDifference(
        solarLongitude(middle),
        315
      );

    if (diff < 0) {
      start = middle;
    } else {
      end = middle;
    }
  }

  return end;
}


/* 日本時間で立春の日付 */

function getRisshunDateJST(year) {

  const risshun = getRisshun(year);

  const jst =
    new Date(
      risshun.getTime()
      + 9 * 60 * 60 * 1000
    );

  return {
    year: jst.getUTCFullYear(),
    month: jst.getUTCMonth() + 1,
    day: jst.getUTCDate()
  };
}


/* その日が立春前か判定 */

function getEffectiveYear(dateString) {

  const parts = dateString.split("-");

  let year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);

  const risshun =
    getRisshunDateJST(year);

  if (
    month < risshun.month ||
    (
      month === risshun.month
      && day < risshun.day
    )
  ) {
    year--;
  }

  return {
    year: year,
    risshun: risshun
  };
}


/* 九星を計算 */

function getYearStar(year) {

  const offset =
    ((2026 - year) % 9 + 9) % 9;

  const starNumber =
    offset + 1;

  return {
    number: starNumber,
    name: starNames[starNumber]
  };
}


/* 年干支を計算
   1984年＝甲子を基準
*/

function getYearKanshi(year) {

  const stemIndex =
    ((year - 1984) % 10 + 10) % 10;

  const branchIndex =
    ((year - 1984) % 12 + 12) % 12;

  return {
    stem: stems[stemIndex],
    branch: branches[branchIndex],
    name:
      stems[stemIndex]
      + branches[branchIndex]
  };
}


/* 本命星 */

function getHonmeiStar(dateString) {

  const effective =
    getEffectiveYear(dateString);

  const star =
    getYearStar(effective.year);

  return {
    number: star.number,
    name: star.name,
    risshun: effective.risshun
  };
}


/* 調べたい日の年盤 */

function getTargetYearData(dateString) {

  const effective =
    getEffectiveYear(dateString);

  const star =
    getYearStar(effective.year);

  const kanshi =
    getYearKanshi(effective.year);

  return {
    year: effective.year,
    star: star,
    kanshi: kanshi,
    risshun: effective.risshun
  };
}


/* ボタン処理 */

function checkDirection() {

  const birthday =
    document.getElementById("birthday").value;

  const targetDate =
    document.getElementById("targetDate").value;

  const result =
    document.getElementById("result");

  if (!birthday || !targetDate) {

    result.style.display = "block";

    result.innerHTML =
      "生年月日と調べたい日を両方入力してください。";

    return;
  }

  const honmei =
    getHonmeiStar(birthday);

  const yearData =
    getTargetYearData(targetDate);

  result.style.display = "block";

  result.innerHTML = `

    <strong>生年月日：</strong>
    ${birthday}<br>

    <strong>本命星：</strong>

    <div class="honmei">
      ${honmei.name}
    </div>

    <div class="year-box">

      <div class="year-title">
        ${targetDate} の年盤
      </div>

      <strong>年盤九星：</strong>
      ${yearData.star.name}
      <br>

      <strong>年干支：</strong>
      ${yearData.kanshi.name}
      <br>

      <strong>年支：</strong>
      ${yearData.kanshi.branch}

    </div>

    <br>

    吉方位の計算機能は、
    これから追加します。

  `;
}

</script>

</body>
</html>
