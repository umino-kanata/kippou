<body>

<div class="container">

<script>

const starNames = {
  1: "一白水星",
  2: "二黒土星",
  3: "三碧木星",
  4: "四緑木星",
  5: "五黄土星",
  6: "六白金星",
  7: "七赤金星",
  8: "八白土星",
  9: "九紫火星"
};

const stems = [
  "甲","乙","丙","丁","戊",
  "己","庚","辛","壬","癸"
];

const branches = [
  "子","丑","寅","卯","辰","巳",
  "午","未","申","酉","戌","亥"
];


/* ---------- ユリウス日 ---------- */

function toJulianDay(date) {

  let y = date.getUTCFullYear();
  let m = date.getUTCMonth() + 1;

  const d =
    date.getUTCDate()
    + date.getUTCHours() / 24
    + date.getUTCMinutes() / 1440
    + date.getUTCSeconds() / 86400;

  if (m <= 2) {
    y--;
    m += 12;
  }

  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);

  return (
    Math.floor(365.25 * (y + 4716))
    + Math.floor(30.6001 * (m + 1))
    + d + B - 1524.5
  );
}


/* ---------- 太陽黄経 ---------- */

function solarLongitude(date) {

  const JD = toJulianDay(date);
  const T = (JD - 2451545.0) / 36525;

  let L0 =
    280.46646
    + T * (36000.76983 + T * 0.0003032);

  L0 = ((L0 % 360) + 360) % 360;

  const M =
    357.52911
    + T * (35999.05029 - 0.0001537 * T);

  const rad = Math.PI / 180;

  const C =
    (1.914602 - T * (0.004817 + 0.000014 * T))
      * Math.sin(M * rad)
    + (0.019993 - 0.000101 * T)
      * Math.sin(2 * M * rad)
    + 0.000289 * Math.sin(3 * M * rad);

  const trueLongitude = L0 + C;

  const omega =
    125.04 - 1934.136 * T;

  let longitude =
    trueLongitude
    - 0.00569
    - 0.00478 * Math.sin(omega * rad);

  return ((longitude % 360) + 360) % 360;
}


/* ---------- 角度差 ---------- */

function angleDifference(angle, target) {
  return ((angle - target + 540) % 360) - 180;
}


/* ---------- 指定黄経になる日時 ---------- */

function getSolarTerm(year, month, targetAngle) {

  let start =
    new Date(Date.UTC(year, month - 1, 1));

  let end =
    new Date(Date.UTC(year, month - 1, 12));

  for (let i = 0; i < 50; i++) {

    const middle =
      new Date(
        (start.getTime() + end.getTime()) / 2
      );

    const diff =
      angleDifference(
        solarLongitude(middle),
        targetAngle
      );

    if (diff < 0) {
      start = middle;
    } else {
      end = middle;
    }
  }

  return end;
}


/* ---------- 日本時間の日付 ---------- */

function getSolarTermDateJST(year, month, angle) {

  const term =
    getSolarTerm(year, month, angle);

  const jst =
    new Date(
      term.getTime()
      + 9 * 60 * 60 * 1000
    );

  return {
    year: jst.getUTCFullYear(),
    month: jst.getUTCMonth() + 1,
    day: jst.getUTCDate()
  };
}


/* ---------- 立春 ---------- */

function getRisshunDateJST(year) {
  return getSolarTermDateJST(year, 2, 315);
}


/* ---------- 年の切替 ---------- */

function getEffectiveYear(dateString) {

  const p = dateString.split("-");

  let year = Number(p[0]);
  const month = Number(p[1]);
  const day = Number(p[2]);

  const risshun =
    getRisshunDateJST(year);

  if (
    month < risshun.month ||
    (
      month === risshun.month
      && day < risshun.day
    )
  ) {
    year--;
  }

  return {
    year: year,
    risshun: risshun
  };
}


/* ---------- 年盤九星 ---------- */

function getYearStar(year) {

  const offset =
    ((2026 - year) % 9 + 9) % 9;

  const number =
    offset + 1;

  return {
    number: number,
    name: starNames[number]
  };
}


/* ---------- 年干支 ---------- */

function getYearKanshi(year) {

  const s =
    ((year - 1984) % 10 + 10) % 10;

  const b =
    ((year - 1984) % 12 + 12) % 12;

  return {
    stem: stems[s],
    branch: branches[b],
    name: stems[s] + branches[b]
  };
}


/* ---------- 本命星 ---------- */

function getHonmeiStar(dateString) {

  const e =
    getEffectiveYear(dateString);

  return getYearStar(e.year);
}


/* ---------- 年盤 ---------- */

function getTargetYearData(dateString) {

  const e =
    getEffectiveYear(dateString);

  return {
    year: e.year,
    star: getYearStar(e.year),
    kanshi: getYearKanshi(e.year)
  };
}

/* ---------- 方位判定の基本データ ---------- */

const directions = [
  "東",
  "南東",
  "南",
  "南西",
  "西",
  "北西",
  "北",
  "北東"
];


/* 反対方位 */

const oppositeDirection = {
  "東": "西",
  "南東": "北西",
  "南": "北",
  "南西": "北東",
  "西": "東",
  "北西": "南東",
  "北": "南",
  "北東": "南西"
};


/*
  中宮の九星から、
  各方位に回る九星を求める
*/

const directionStars = {

  1: {
    "東": 8,
    "南東": 9,
    "南": 5,
    "南西": 7,
    "西": 3,
    "北西": 2,
    "北": 6,
    "北東": 4
  },

  2: {
    "東": 9,
    "南東": 1,
    "南": 6,
    "南西": 8,
    "西": 4,
    "北西": 3,
    "北": 7,
    "北東": 5
  },

  3: {
    "東": 1,
    "南東": 2,
    "南": 7,
    "南西": 9,
    "西": 5,
    "北西": 4,
    "北": 8,
    "北東": 6
  },

  4: {
    "東": 2,
    "南東": 3,
    "南": 8,
    "南西": 1,
    "西": 6,
    "北西": 5,
    "北": 9,
    "北東": 7
  },

  5: {
    "東": 3,
    "南東": 4,
    "南": 9,
    "南西": 2,
    "西": 7,
    "北西": 6,
    "北": 1,
    "北東": 8
  },

  6: {
    "東": 4,
    "南東": 5,
    "南": 1,
    "南西": 3,
    "西": 8,
    "北西": 7,
    "北": 2,
    "北東": 9
  },

  7: {
    "東": 5,
    "南東": 6,
    "南": 2,
    "南西": 4,
    "西": 9,
    "北西": 8,
    "北": 3,
    "北東": 1
  },

  8: {
    "東": 6,
    "南東": 7,
    "南": 3,
    "南西": 5,
    "西": 1,
    "北西": 9,
    "北": 4,
    "北東": 2
  },

  9: {
    "東": 7,
    "南東": 8,
    "南": 4,
    "南西": 6,
    "西": 2,
    "北西": 1,
    "北": 5,
    "北東": 3
  }

};


/* ---------- 九星の五行 ---------- */

const starElements = {
  1: "水",
  2: "土",
  3: "木",
  4: "木",
  5: "土",
  6: "金",
  7: "金",
  8: "土",
  9: "火"
};


/*
  五行の相生
  木 → 火 → 土 → 金 → 水 → 木
*/

const produces = {
  "木": "火",
  "火": "土",
  "土": "金",
  "金": "水",
  "水": "木"
};


/*
  本命星に対して
  吉となる九星か
*/

function isLuckyStar(honmeiNumber, starNumber) {

  const honmeiElement =
    starElements[honmeiNumber];

  const starElement =
    starElements[starNumber];

  // 和気
  if (honmeiElement === starElement) {
    return true;
  }

  // 生気
  if (produces[starElement] === honmeiElement) {
    return true;
  }

  // 退気
  if (produces[honmeiElement] === starElement) {
    return true;
  }

  return false;
}


/* ---------- 十二支の方位 ---------- */

const branchDirections = {
  "子": "北",
  "丑": "北東",
  "寅": "北東",
  "卯": "東",
  "辰": "南東",
  "巳": "南東",
  "午": "南",
  "未": "南西",
  "申": "南西",
  "酉": "西",
  "戌": "北西",
  "亥": "北西"
};


/* ---------- 年盤の〇方位 ---------- */

/* ---------- 1つの盤の方位状態を判定 ---------- */

function getDirectionStatuses(
  honmeiNumber,
  centerStarNumber,
  branch
) {

  const stars =
    directionStars[centerStarNumber];

  const result = {};

  let gokouDirection = null;
  let honmeiDirection = null;


  /*
    五黄の方位と
    本命星の方位を探す
  */

  for (const direction of directions) {

    if (stars[direction] === 5) {
      gokouDirection = direction;
    }

    if (stars[direction] === honmeiNumber) {
      honmeiDirection = direction;
    }
  }


  /*
    暗剣殺
    本命的殺
  */

  const ankenDirection =
    gokouDirection
      ? oppositeDirection[gokouDirection]
      : null;

  const honmeiTekiDirection =
    honmeiDirection
      ? oppositeDirection[honmeiDirection]
      : null;


  /*
    破
    その盤の干支の反対方向
  */

  const branchDirection =
    branchDirections[branch];

  const haDirection =
    oppositeDirection[branchDirection];


  /*
    8方位を順番に判定
  */

  for (const direction of directions) {

    const starNumber =
      stars[direction];


    /*
      強い凶
      五黄殺・暗剣殺・本命殺・
      本命的殺・破
    */

    if (
      direction === gokouDirection ||
      direction === ankenDirection ||
      direction === honmeiDirection ||
      direction === honmeiTekiDirection ||
      direction === haDirection
    ) {

      result[direction] = "×";
      continue;
    }


    /*
      相生・和気なら吉
    */

    if (
      isLuckyStar(
        honmeiNumber,
        starNumber
      )
    ) {

      result[direction] = "〇";

    } else {

      /*
        現段階では普通の凶も
        吉方候補から除外する
      */

      result[direction] = "×";
    }
  }

  return result;
}


/* ---------- 年盤の方位状態 ---------- */

function getYearDirectionStatuses(
  honmeiNumber,
  yearStarNumber,
  yearBranch
) {

  return getDirectionStatuses(
    honmeiNumber,
    yearStarNumber,
    yearBranch
  );
}
/* ---------- 月の節入り角度 ---------- */

const monthAngles = {
  1: 285,
  2: 315,
  3: 345,
  4: 15,
  5: 45,
  6: 75,
  7: 105,
  8: 135,
  9: 165,
  10: 195,
  11: 225,
  12: 255
};


/* ---------- 節月判定 ---------- */

function getSetsuMonth(dateString) {

  const p = dateString.split("-");

  const year = Number(p[0]);
  const month = Number(p[1]);
  const day = Number(p[2]);

  const term =
    getSolarTermDateJST(
      year,
      month,
      monthAngles[month]
    );

  let setsuMonth;
  let setsuYear;

  if (day >= term.day) {

    setsuMonth = month;

    if (month === 1) {
      setsuYear = year - 1;
    } else {
      setsuYear = year;
    }

  } else {

    if (month === 1) {

      setsuMonth = 12;
      setsuYear = year - 1;

    } else if (month === 2) {

      setsuMonth = 1;
      setsuYear = year - 1;

    } else {

      setsuMonth = month - 1;
      setsuYear = year;
    }
  }

  return {
    setsuMonth: setsuMonth,
    setsuYear: setsuYear,
    term: term
  };
}


/* ---------- 月盤九星 ---------- */

function getMonthStar(dateString) {

  const setsu =
    getSetsuMonth(dateString);

  const effectiveYear =
    setsu.setsuYear;

  const yearStar =
    getYearStar(effectiveYear).number;

  let febStar;

  /*
    一四七年 → 寅月は八白
    二五八年 → 寅月は二黒
    三六九年 → 寅月は五黄
  */

  if ([1,4,7].includes(yearStar)) {

    febStar = 8;

  } else if ([2,5,8].includes(yearStar)) {

    febStar = 2;

  } else {

    febStar = 5;
  }

  let distance;

  if (setsu.setsuMonth >= 2) {

    distance =
      setsu.setsuMonth - 2;

  } else {

    distance = 11;
  }

  let number =
    febStar - distance;

  while (number <= 0) {
    number += 9;
  }

  return {
    number: number,
    name: starNames[number]
  };
}


/* ---------- 月干支 ---------- */

function getMonthKanshi(dateString) {

  const setsu =
    getSetsuMonth(dateString);

  const effectiveYear =
    setsu.setsuYear;

  const yearStem =
    getYearKanshi(effectiveYear).stem;

  const yearStemIndex =
    stems.indexOf(yearStem);

  const febStemStart = {
    0: 2,
    5: 2,
    1: 4,
    6: 4,
    2: 6,
    7: 6,
    3: 8,
    8: 8,
    4: 0,
    9: 0
  };

  let distance;

  if (setsu.setsuMonth >= 2) {

    distance =
      setsu.setsuMonth - 2;

  } else {

    distance = 11;
  }

  const stemIndex =
    (
      febStemStart[yearStemIndex]
      + distance
    ) % 10;

  const branchIndex =
    (2 + distance) % 12;

  return {
    stem: stems[stemIndex],
    branch: branches[branchIndex],
    name:
      stems[stemIndex]
      + branches[branchIndex]
  };
}

 /* ---------- 日盤 ---------- */

/*
  日干支の基準日
  2026/6/19 ＝ 甲子

  日盤九星の切替
  陰遁開始日は九紫から下降
  陽遁開始日は一白から上昇
*/

const dayStarTransitions = [
  { date: "2026-06-19", mode: "陰遁", startStar: 9 },
  { date: "2026-12-16", mode: "陽遁", startStar: 1 },

  { date: "2027-06-14", mode: "陰遁", startStar: 9 },
  { date: "2027-12-11", mode: "陽遁", startStar: 1 },

  { date: "2028-06-08", mode: "陰遁", startStar: 9 },
  { date: "2028-12-05", mode: "陽遁", startStar: 1 }
];


/* ---------- 日付を日数に変換 ---------- */

function dateStringToDayNumber(dateString) {

  const p = dateString.split("-");

  const year = Number(p[0]);
  const month = Number(p[1]);
  const day = Number(p[2]);

  return Math.floor(
    Date.UTC(year, month - 1, day)
    / 86400000
  );
}


/* ---------- 2つの日付の日数差 ---------- */

function getDayDifference(fromDate, toDate) {

  return (
    dateStringToDayNumber(toDate)
    - dateStringToDayNumber(fromDate)
  );
}


/* ---------- 日干支 ---------- */

function getDayKanshi(dateString) {

  const baseDate = "2026-06-19";

  const diff =
    getDayDifference(baseDate, dateString);

  const index =
    ((diff % 60) + 60) % 60;

  const stemIndex =
    index % 10;

  const branchIndex =
    index % 12;

  return {
    stem: stems[stemIndex],
    branch: branches[branchIndex],
    name:
      stems[stemIndex]
      + branches[branchIndex]
  };
}


/* ---------- その日の遁を判定 ---------- */

function getDayTransition(dateString) {

  let transition = null;

  for (const item of dayStarTransitions) {

    if (dateString >= item.date) {
      transition = item;
    } else {
      break;
    }
  }

  return transition;
}


/* ---------- 日盤九星 ---------- */

function getDayStar(dateString) {

  const transition =
    getDayTransition(dateString);

  if (!transition) {
    return null;
  }

  const diff =
    getDayDifference(
      transition.date,
      dateString
    );

  let number;

  if (transition.mode === "陽遁") {

    number =
      ((transition.startStar - 1 + diff) % 9) + 1;

  } else {

    number =
      transition.startStar - (diff % 9);

    while (number <= 0) {
      number += 9;
    }
  }

  return {
    number: number,
    name: starNames[number],
    mode: transition.mode
  };
}


/* ---------- 日盤データ ---------- */

function getTargetDayData(dateString) {

  const startDate = "2026-06-19";
  const endDate = "2028-12-31";

  if (
    dateString < startDate ||
    dateString > endDate
  ) {
    return {
      supported: false
    };
  }

  return {
    supported: true,
    star: getDayStar(dateString),
    kanshi: getDayKanshi(dateString)
  };
} 

/* ---------- 月盤データ ---------- */

function getTargetMonthData(dateString) {

  const setsu =
    getSetsuMonth(dateString);

  return {
    setsuMonth: setsu.setsuMonth,
    setsuYear: setsu.setsuYear,
    term: setsu.term,
    star: getMonthStar(dateString),
    kanshi: getMonthKanshi(dateString)
  };
}


/* ---------- 表示 ---------- */

function checkDirection() {

  const birthday =
    document.getElementById("birthday").value;

  const targetDate =
    document.getElementById("targetDate").value;

  const result =
    document.getElementById("result");

  if (!birthday || !targetDate) {

    result.style.display = "block";

    result.innerHTML =
      "生年月日と調べたい日を両方入力してください。";

    return;
  }

  const honmei =
    getHonmeiStar(birthday);

  const yearData =
    getTargetYearData(targetDate);

  const yearDirections =
  getYearDirectionStatuses(
    honmei.number,
    yearData.star.number,
    yearData.kanshi.branch
  );
  
  const monthData =
    getTargetMonthData(targetDate);
 
  const dayData =
  getTargetDayData(targetDate);

  result.style.display = "block";

  result.innerHTML = `

    <strong>生年月日：</strong>
    ${birthday}<br>

    <strong>本命星：</strong>

    <div class="honmei">
      ${honmei.name}
    </div>

    <div class="data-box">

      <div class="data-title">
        年盤
      </div>

      <strong>九星：</strong>
      ${yearData.star.name}<br>

      <strong>干支：</strong>
      ${yearData.kanshi.name}

<br><br>

<strong>〇方位：</strong>
${directions
  .filter(direction => yearDirections[direction] === "〇")
  .join("・")}
    </div>

    <div class="data-box">

      <div class="data-title">
        月盤
      </div>

      <strong>九星：</strong>
      ${monthData.star.name}<br>

      <strong>干支：</strong>
      ${monthData.kanshi.name}<br>

      <strong>節入り：</strong>
      ${monthData.term.month}月
      ${monthData.term.day}日

    </div>

    <div class="data-box">

      <div class="data-title">
        日盤
      </div>

      ${
        dayData.supported
        ? `
          <strong>九星：</strong>
          ${dayData.star.name}<br>

          <strong>干支：</strong>
          ${dayData.kanshi.name}<br>

          <strong>遁：</strong>
          ${dayData.star.mode}
        `
        : `
          この日の日盤は、
          現在のプロトタイプの対応範囲外です。
